<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Speed Tap Challenge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: Arial, sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
  // 1. Setup Canvas & Responsiveness
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // 2. Game State Variables
  let score = 0;
  let timeLeft = 15;
  let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
  let target = { x: 0, y: 0, radius: 45, color: '#FF0055' };
  let timerInterval = null;
  let isPaused = false;

  function spawnTarget() {
    const padding = target.radius + 20;
    target.x = padding + Math.random() * (canvas.width - padding * 2);
    target.y = padding + 80 + Math.random() * (canvas.height - padding * 2 - 80);
  }

  function startGame() {
    score = 0;
    timeLeft = 15;
    gameState = 'PLAYING';
    spawnTarget();

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (!isPaused && gameState === 'PLAYING') {
        timeLeft--;
        if (timeLeft <= 0) {
          gameState = 'GAMEOVER';
          clearInterval(timerInterval);
        }
      }
    }, 1000);
  }

  function handleInput(clientX, clientY) {
    if (gameState === 'START' || gameState === 'GAMEOVER') {
      startGame();
      return;
    }

    if (gameState === 'PLAYING' && !isPaused) {
      const dist = Math.hypot(clientX - target.x, clientY - target.y);
      if (dist < target.radius) {
        score += 10;
        spawnTarget();
      }
    }
  }

  canvas.addEventListener('pointerdown', (e) => handleInput(e.clientX, e.clientY));

  // 3. Main Render Loop
  function draw() {
    ctx.fillStyle = '#181818';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`Score: ${score}`, 20, 40);

    ctx.textAlign = 'right';
    ctx.fillText(`Time: ${timeLeft}s`, canvas.width - 20, 40);

    if (gameState === 'START') {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 36px Arial';
      ctx.fillText('SPEED TAP', canvas.width / 2, canvas.height / 2 - 30);
      
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '18px Arial';
      ctx.fillText('Tap targets as fast as you can!', canvas.width / 2, canvas.height / 2 + 15);
      ctx.fillText('Tap anywhere to Start', canvas.width / 2, canvas.height / 2 + 55);

    } else if (gameState === 'PLAYING') {
      if (isPaused) {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 28px Arial';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
      } else {
        ctx.beginPath();
        ctx.arc(target.x, target.y, target.radius, 0, Math.PI * 2);
        ctx.fillStyle = target.color;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#FFFFFF';
        ctx.stroke();
        ctx.closePath();
      }

    } else if (gameState === 'GAMEOVER') {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#FF5555';
      ctx.font = 'bold 36px Arial';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 30);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '22px Arial';
      ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
      ctx.fillText('Tap anywhere to Play Again', canvas.width / 2, canvas.height / 2 + 55);
    }

    requestAnimationFrame(draw);
  }

  // Start game loop immediately
  draw();

  // 4. Safe YouTube Playables SDK Integration
  (function loadYTSDK() {
    const script = document.createElement('script');
    script.src = "https://www.youtube.com/game_api/v1";
    script.onload = () => {
      if (typeof ytgame !== 'undefined' && ytgame.game) {
        ytgame.game.firstFrameReady();
        ytgame.game.gameReady();
        ytgame.game.onPause(() => { isPaused = true; });
        ytgame.game.onResume(() => { isPaused = false; });
      }
    };
    document.head.appendChild(script);
  })();
</script>
</body>
</html>
